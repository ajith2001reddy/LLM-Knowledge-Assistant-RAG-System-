[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-knowledge-assistant-rag"
version = "0.1.0"
description = "A demo-ready Retrieval-Augmented Generation knowledge assistant built with LangChain and FAISS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "faiss-cpu>=1.8.0",
  "langchain>=0.2.17",
  "langchain-community>=0.2.10",
  "langchain-core>=0.2.30",
  "langchain-openai>=0.1.22",
  "langchain-text-splitters>=0.2.2",
  "python-dotenv>=1.0.1"
]

[project.scripts]
rag-ingest = "rag_assistant.ingest:main"
rag-chat = "rag_assistant.chat:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
